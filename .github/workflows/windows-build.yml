name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt Pillow
      - name: Ensure icon exists
        shell: pwsh
        run: |
          if (!(Test-Path assets/icon.ico)) {
            New-Item -ItemType Directory -Force assets | Out-Null
            @'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          im = Image.new("RGBA",(256,256),(52,169,70,255))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((8,8,248,248),radius=50,outline=(230,255,190),width=8)
          font = ImageFont.truetype("C:/Windows/Fonts/msyh.ttc",125)
          d.text((52,45),"牛",fill=(255,255,255),font=font)
          im.save("assets/icon.ico",sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
          }
      - name: Build Windows executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --name NiuMaNotes --icon assets/icon.ico --add-data "assets;assets" main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NiuMaNotes-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: NiuMaNotes-Portable
          path: dist/NiuMaNotes/**
          if-no-files-found: error
