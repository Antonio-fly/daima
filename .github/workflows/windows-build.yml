name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Windows desktop exe
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --name NiuMaNotes --icon assets/icon.ico --add-data 'assets;assets' main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows setup exe
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NiuMaNotes-Windows-Installer
          path: dist/installer/*.exe
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: NiuMaNotes-Portable
          path: dist/NiuMaNotes/**
